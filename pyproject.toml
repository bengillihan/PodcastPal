[project]
name = "podcastpal"
version = "0.1.0"
description = "Self-hosted podcast RSS feeds for audio stored on Dropbox or Google Drive"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.0.0",
    "oauthlib>=4.0.0",
    "psycopg2-binary>=2.9.13",
    "python-slugify>=9.1.3",
    "pytz>=2026.5",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "werkzeug>=3.1.9",
]
